# /etc/ssh/sshd_config.d/50-hardening.conf
#
# Passes SSH-001 to SSH-008. Before reloading, make sure you can log in with a key as a normal user
# that has sudo, and keep your current session open:
#
#   sudo sshd -t && sudo systemctl reload ssh
#
# Files in sshd_config.d are read in lexical order and the FIRST value wins, so a cloud image file such as
# 50-cloud-init.conf with "PasswordAuthentication yes" overrides this one. Rename this file to sort
# earlier (for example 01-hardening.conf) or remove the other setting.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30

# Optional: only members of this group may log in (create it first: sudo groupadd sshusers)
# AllowGroups sshusers
