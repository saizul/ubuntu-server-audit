[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubuntu-server-audit"
dynamic = ["version"]
description = "Read-only security and best-practice audit for Ubuntu 22.04/24.04 web servers: SSH, firewall, updates, sysctl, accounts, nginx, PHP, MariaDB, Redis and housekeeping checks with evidence, fix hints and a score. Text, JSON, Markdown and HTML reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin" }]
keywords = ["security-audit", "ubuntu", "server-hardening", "linux", "vps", "nginx", "devops", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/saizul/ubuntu-server-audit"
Issues = "https://github.com/saizul/ubuntu-server-audit/issues"
Changelog = "https://github.com/saizul/ubuntu-server-audit/blob/main/CHANGELOG.md"

[project.scripts]
ubuntu-server-audit = "ubuntu_server_audit.cli:main"

[tool.setuptools.dynamic]
version = { attr = "ubuntu_server_audit._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ubuntu_server_audit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["SIM108", "RUF022", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
